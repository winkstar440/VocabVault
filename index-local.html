<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多層級單字表 (Local Storage 版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f8fafc; color: #1e293b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-lg font-semibold tracking-tight flex items-center gap-2">
        <i class="fa-solid fa-layer-group text-indigo-600"></i> 多層級單字表 (本地版)
      </h1>
      <span class="text-xs px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-600 font-medium">
        <i class="fa-solid fa-hard-drive mr-1"></i> 本地儲存
      </span>
    </div>
  </header>
  <main class="max-w-md w-full mx-auto p-4 flex-1 pb-24">
    <p class="text-sm text-slate-500 mb-4">這是舊的 Local Storage 版本。最新版請使用 <code>index.html</code>（Firebase 雲端版）。</p>
    <p class="text-xs text-slate-400">如需完整本地版功能，請參考倉庫歷史版本或重新下載。</p>
  </main>
</body>
</html>
