<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>極簡雲端單字表</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #f8fafc;
      color: #1e293b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- 頂部導覽列 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-lg font-semibold tracking-tight flex items-center gap-2">
        <i class="fa-solid fa-book-open text-indigo-600"></i> 我的單字表
      </h1>
      <div id="sync-status" class="text-xs px-2.5 py-1 rounded-full bg-slate-100 text-slate-500 flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse" id="status-dot"></span>
        <span id="status-text">連線中...</span>
      </div>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-md w-full mx-auto p-4 flex-1 pb-24">

    <!-- 篩選與資料夾切換區 -->
    <div class="mb-5 space-y-3">
      <div class="flex gap-2">
        <select id="folder-select" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="all">📂 全部詞彙 (All Words)</option>
        </select>
        <button onclick="openFolderModal()" class="bg-white border border-slate-200 px-3 py-2.5 rounded-xl text-sm font-medium hover:bg-slate-50 shrink-0">
          <i class="fa-solid fa-folder-plus text-indigo-600"></i> 新增資料夾
        </button>
      </div>

      <!-- 搜尋框 -->
      <div class="relative">
        <i class="fa-solid fa-search absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
        <input type="text" id="search-input" placeholder="搜尋單字或翻譯..." oninput="renderApp()" class="w-full bg-white border border-slate-200 rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
    </div>

    <!-- 單字列表 -->
    <div id="word-list" class="space-y-3">
      <!-- 動態生成 -->
    </div>

    <!-- 空狀態提示 -->
    <div id="empty-state" class="hidden text-center py-12 text-slate-400">
      <i class="fa-solid fa-box-open text-4xl mb-2"></i>
      <p class="text-sm">目前沒有單字，點擊下方按鈕新增吧！</p>
    </div>

  </main>

  <!-- 底部固定新增按鈕 -->
  <div class="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-md border-t border-slate-200 p-4">
    <div class="max-w-md mx-auto">
      <button onclick="openWordModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl shadow-sm transition flex items-center justify-center gap-2 text-sm">
        <i class="fa-solid fa-plus"></i> 新增單字
      </button>
    </div>
  </div>

  <!-- 新增/編輯單字 Modal -->
  <div id="word-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-xl transform transition-transform">
      <div class="flex justify-between items-center mb-4">
        <h3 id="modal-title" class="font-semibold text-base">新增單字</h3>
        <button onclick="closeWordModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form id="word-form" onsubmit="handleWordSubmit(event)" class="space-y-4">
        <input type="hidden" id="word-id">
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">單字 / 詞彙</label>
          <input type="text" id="word-term" required placeholder="例如: Hello / こんにちは" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">翻譯 / 解釋</label>
          <input type="text" id="word-definition" required placeholder="例如: 你好" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">選擇資料夾</label>
            <select id="word-folder" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <!-- 動態生成 -->
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">語言代碼 (發音用)</label>
            <select id="word-lang" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="en-US">英語 (English)</option>
              <option value="ja-JP">日語 (日本語)</option>
              <option value="ko-KR">韓語 (한국어)</option>
              <option value="zh-CN">普通話 (Mandarin)</option>
              <option value="fr-FR">法語 (Français)</option>
              <option value="es-ES">西班牙語 (Español)</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">備註 / 例句 (選填)</label>
          <input type="text" id="word-note" placeholder="例如: 用於打招呼" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition text-sm mt-2">儲存單字</button>
      </form>
    </div>
  </div>

  <!-- 新增資料夾 Modal -->
  <div id="folder-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-xs rounded-2xl p-6 shadow-xl">
      <h3 class="font-semibold text-base mb-4">新增分類資料夾</h3>
      <input type="text" id="new-folder-name" placeholder="資料夾名稱 (例如: 日文常用)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-4">
      <div class="flex gap-2">
        <button onclick="closeFolderModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 rounded-xl text-sm font-medium">取消</button>
        <button onclick="createFolder()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl text-sm font-medium">建立</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 你的 Firebase 設定
    const firebaseConfig = {
      apiKey: "AIzaSyBGtBlMHiCJFrzV6jzFMSaYrpWCHUwKdrc",
      authDomain: "vocab-app-a95c0.firebaseapp.com",
      projectId: "vocab-app-a95c0",
      storageBucket: "vocab-app-a95c0.firebasestorage.app",
      messagingSenderId: "322032736816",
      appId: "1:322032736816:web:3f42b3b06b2273c46febf5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUserId = null;
    let folders = ["預設資料夾"];
    let words = [];

    // 匿名登入並載入資料
    signInAnonymously(auth).then(() => {
      onAuthStateChanged(auth, (user) => {
        if (user) {
          currentUserId = user.uid;
          document.getElementById('status-dot').className = "w-2 h-2 rounded-full bg-emerald-500";
          document.getElementById('status-text').innerText = "已連線雲端";
          loadData();
        }
      });
    }).catch((error) => {
      document.getElementById('status-dot').className = "w-2 h-2 rounded-full bg-rose-500";
      document.getElementById('status-text').innerText = "連線失敗";
      console.error("Auth error:", error);
    });

    // 從 Firestore 讀取資料
    window.loadData = async function() {
      if (!currentUserId) return;
      try {
        const docRef = doc(db, "users", currentUserId, "data", "vocabData");
        const querySnapshot = await getDocs(collection(db, "users", currentUserId, "words"));
        
        words = [];
        querySnapshot.forEach((doc) => {
          words.push({ id: doc.id, ...doc.data() });
        });

        // 讀取資料夾
        const metaDoc = await getDocs(collection(db, "users", currentUserId, "meta"));
        metaDoc.forEach((doc) => {
          if (doc.id === "folders" && doc.data().list) {
            folders = doc.data().list;
          }
        });

        updateUI();
      } catch (e) {
        console.error("載入資料失敗: ", e);
      }
    }

    // 儲存單字到 Firestore
    window.saveWordToCloud = async function(wordObj) {
      if (!currentUserId) return;
      const wordId = wordObj.id || Date.now().toString();
      wordObj.id = wordId;
      await setDoc(doc(db, "users", currentUserId, "words", wordId), wordObj);
      loadData();
    }

    // 從雲端刪除單字
    window.deleteWordFromCloud = async function(wordId) {
      if (!currentUserId) return;
      await deleteDoc(doc(db, "users", currentUserId, "words", wordId));
      loadData();
    }

    // 儲存資料夾到雲端
    window.saveFoldersToCloud = async function() {
      if (!currentUserId) return;
      await setDoc(doc(db, "users", currentUserId, "meta", "folders"), { list: folders });
    }

    window.dbReady = true;
  </script>

  <!-- 前端邏輯控制 -->
  <script>
    // 介面渲染與互動控制
    function updateUI() {
      renderFolderSelects();
      renderApp();
    }

    function renderFolderSelects() {
      const folderSelect = document.getElementById('folder-select');
      const wordFolder = document.getElementById('word-folder');
      
      const currentSelected = folderSelect.value;
      
      let html = '<option value="all">📂 全部詞彙 (All Words)</option>';
      let modalHtml = '';

      folders.forEach(folder => {
        html += `<option value="${folder}">${folder}</option>`;
        modalHtml += `<option value="${folder}">${folder}</option>`;
      });

      folderSelect.innerHTML = html;
      wordFolder.innerHTML = modalHtml;
      
      if(currentSelected) folderSelect.value = currentSelected;
    }

    function renderApp() {
      const selectedFolder = document.getElementById('folder-select').value;
      const keyword = document.getElementById('search-input').value.toLowerCase();
      const listContainer = document.getElementById('word-list');
      const emptyState = document.getElementById('empty-state');

      let filtered = words.filter(w => {
        const matchFolder = (selectedFolder === 'all' || w.folder === selectedFolder);
        const matchKeyword = w.term.toLowerCase().includes(keyword) || w.definition.toLowerCase().includes(keyword);
        return matchFolder && matchKeyword;
      });

      if (filtered.length === 0) {
        listContainer.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      let html = '';

      filtered.forEach(w => {
        html += `
          <div class="bg-white border border-slate-200/80 rounded-2xl p-4 shadow-2xs flex items-center justify-between gap-3">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-0.5">
                <span class="font-semibold text-slate-800 text-base truncate">${w.term}</span>
                <span class="text-xs px-2 py-0.5 rounded-md bg-indigo-50 text-indigo-600 font-medium shrink-0">${w.folder}</span>
              </div>
              <p class="text-sm text-slate-600 truncate">${w.definition}</p>
              ${w.note ? `<p class="text-xs text-slate-400 mt-1 truncate"><i class="fa-solid fa-note-sticky mr-1"></i>${w.note}</p>` : ''}
            </div>
            <div class="flex items-center gap-1 shrink-0">
              <button onclick="speak('${w.term}', '${w.lang || 'en-US'}')" class="w-9 h-9 rounded-xl bg-slate-50 hover:bg-indigo-50 text-slate-600 hover:text-indigo-600 flex items-center justify-center transition">
                <i class="fa-solid fa-volume-high text-xs"></i>
              </button>
              <button onclick="deleteWord('${w.id}')" class="w-9 h-9 rounded-xl bg-slate-50 hover:bg-rose-50 text-slate-400 hover:text-rose-600 flex items-center justify-center transition">
                <i class="fa-solid fa-trash-can text-xs"></i>
              </button>
            </div>
          </div>
        `;
      });

      listContainer.innerHTML = html;
    }

    // 發音功能
    function speak(text, lang) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      } else {
        alert("您的瀏覽器不支援語音朗讀功能");
      }
    }

    // Modal 控制
    function openWordModal() {
      document.getElementById('word-id').value = '';
      document.getElementById('word-term').value = '';
      document.getElementById('word-definition').value = '';
      document.getElementById('word-note').value = '';
      document.getElementById('modal-title').innerText = '新增單字';
      document.getElementById('word-modal').classList.remove('hidden');
    }

    function closeWordModal() {
      document.getElementById('word-modal').classList.add('hidden');
    }

    function openFolderModal() {
      document.getElementById('new-folder-name').value = '';
      document.getElementById('folder-modal').classList.remove('hidden');
    }

    function closeFolderModal() {
      document.getElementById('folder-modal').classList.add('hidden');
    }

    // 建立新資料夾
    function createFolder() {
      const name = document.getElementById('new-folder-name').value.trim();
      if(name && !folders.includes(name)) {
        folders.push(name);
        if(typeof saveFoldersToCloud === 'function') saveFoldersToCloud();
        updateUI();
        closeFolderModal();
      } else {
        alert('資料夾名稱不能為空或已存在！');
      }
    }

    // 提交單字表單
    function handleWordSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('word-id').value;
      const term = document.getElementById('word-term').value.trim();
      const definition = document.getElementById('word-definition').value.trim();
      const folder = document.getElementById('word-folder').value;
      const lang = document.getElementById('word-lang').value;
      const note = document.getElementById('word-note').value.trim();

      const wordObj = { id: id || undefined, term, definition, folder, lang, note };
      
      if(typeof saveWordToCloud === 'function') {
        saveWordToCloud(wordObj);
      }
      
      closeWordModal();
    }

    // 刪除單字
    function deleteWord(id) {
      if(confirm('確定要刪除這個單字嗎？')) {
        if(typeof deleteWordFromCloud === 'function') {
          deleteWordFromCloud(id);
        }
      }
    }

    // 監聽資料夾切換
    document.getElementById('folder-select').addEventListener('change', renderApp);
  </script>
</body>
</html>
