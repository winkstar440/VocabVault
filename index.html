<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多層級雲端單字表 (Firebase 雲端同步版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f8fafc; color: #1e293b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- 🔐 登入/註冊畫面 (未登入時顯示) -->
  <div id="login-screen" class="fixed inset-0 bg-slate-50 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-xl border border-slate-200">
      <div class="text-center mb-6">
        <div class="w-14 h-14 bg-indigo-50 text-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-2xl mb-3 shadow-inner">
          <i class="fa-solid fa-cloud-arrow-up"></i>
        </div>
        <h2 class="text-xl font-bold text-slate-800">雲端單字庫登入</h2>
        <p class="text-xs text-slate-500 mt-1">首次使用請直接輸入 Email 與密碼註冊</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">電子郵件 (Email)</label>
          <input type="email" id="auth-email" placeholder="name@example.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">密碼 (Password)</label>
          <input type="password" id="auth-password" placeholder="請輸入密碼 (至少6位數)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="flex gap-2 pt-2">
          <button onclick="handleLogin()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl transition text-sm shadow-sm">登入</button>
          <button onclick="handleRegister()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 rounded-xl transition text-sm">註冊新帳號</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 頂部導覽列 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-lg font-semibold tracking-tight flex items-center gap-2">
        <i class="fa-solid fa-layer-group text-indigo-600"></i> 雲端單字表
      </h1>
      <div class="flex items-center gap-2">
        <span id="user-email-display" class="text-xs text-slate-500 font-medium truncate max-w-[150px]"></span>
        <button onclick="handleLogout()" class="text-xs px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-rose-50 text-slate-600 hover:text-rose-600 transition" title="登出">
          <i class="fa-solid fa-arrow-right-from-bracket"></i> 登出
        </button>
      </div>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-md w-full mx-auto p-4 flex-1 pb-24">

    <!-- 第一層：選擇語言大分類 -->
    <div class="mb-4">
      <label class="block text-xs font-medium text-slate-500 mb-1">1. 選擇語言大分類</label>
      <div class="flex gap-2">
        <select id="lang-select" onchange="onLanguageChange()" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
        </select>
        <button onclick="openLangModal()" class="bg-white border border-slate-200 px-3 py-2.5 rounded-xl text-sm font-medium hover:bg-slate-50 shrink-0">
          <i class="fa-solid fa-plus text-indigo-600"></i> 新語言
        </button>
      </div>
    </div>

    <!-- 第二層：選擇子資料夾 -->
    <div class="mb-5">
      <label class="block text-xs font-medium text-slate-500 mb-1">2. 選擇子資料夾</label>
      <div class="flex gap-2">
        <select id="subfolder-select" onchange="onSubFolderChange()" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
        </select>
        <button onclick="openSubFolderModal()" class="bg-white border border-slate-200 px-3 py-2.5 rounded-xl text-sm font-medium hover:bg-slate-50 shrink-0">
          <i class="fa-solid fa-folder-plus text-indigo-600"></i> 新子夾
        </button>
      </div>
    </div>

    <!-- 搜尋框 -->
    <div class="mb-5 relative">
      <i class="fa-solid fa-search absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
      <input type="text" id="search-input" placeholder="搜尋目前語言下的單字..." oninput="renderApp()" class="w-full bg-white border border-slate-200 rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </div>

    <!-- 單字列表 -->
    <div id="word-list" class="space-y-3"></div>

    <!-- 空狀態提示 -->
    <div id="empty-state" class="hidden text-center py-12 text-slate-400">
      <i class="fa-solid fa-box-open text-4xl mb-2"></i>
      <p class="text-sm">這個子資料夾還沒有單字，點擊下方按鈕新增吧！</p>
    </div>

  </main>

  <!-- 底部固定新增與備份區域 -->
  <div class="fixed bottom-0 left-0 right-0 bg-white/85 backdrop-blur-md border-t border-slate-200 p-4">
    <div class="max-w-md mx-auto flex gap-2">
      <button onclick="openWordModal()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl shadow-sm transition flex items-center justify-center gap-2 text-sm">
        <i class="fa-solid fa-plus"></i> 在當前子夾新增單字
      </button>
      <button onclick="exportData()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-3 rounded-xl transition flex items-center justify-center text-sm font-medium shrink-0" title="複製備份資料">
        <i class="fa-solid fa-copy mr-1.5 text-indigo-600"></i> 備份
      </button>
    </div>
  </div>

  <!-- 新增/編輯單字 Modal -->
  <div id="word-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-xl">
      <div class="flex justify-between items-center mb-4">
        <h3 id="modal-title" class="font-semibold text-base">新增單字</h3>
        <button onclick="closeWordModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form onsubmit="handleWordSubmit(event)" class="space-y-4">
        <input type="hidden" id="edit-word-id" value="">
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">單字 / 詞彙</label>
          <input type="text" id="word-term" required placeholder="例如: 準備 / Vocabulary" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">翻譯 / 解釋</label>
          <input type="text" id="word-definition" required placeholder="例如: 翻譯或解釋" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">備註 / 例句 (選填)</label>
          <input type="text" id="word-note" placeholder="例如: 常用於日常對話" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition text-sm mt-2">確認新增</button>
      </form>
    </div>
  </div>

  <!-- 新增語言大分類 Modal -->
  <div id="lang-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-xs rounded-2xl p-6 shadow-xl">
      <h3 class="font-semibold text-base mb-4">新增語言大分類</h3>
      <input type="text" id="new-lang-name" placeholder="例如: 法文" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-4">
      <div class="flex gap-2">
        <button onclick="closeLangModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 rounded-xl text-sm font-medium">取消</button>
        <button onclick="createLanguage()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl text-sm font-medium">建立</button>
      </div>
    </div>
  </div>

  <!-- 新增子資料夾 Modal -->
  <div id="subfolder-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-xs rounded-2xl p-6 shadow-xl">
      <h3 class="font-semibold text-base mb-4">在當前語言新增子資料夾</h3>
      <input type="text" id="new-subfolder-name" placeholder="例如: travel, vocab" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-4">
      <div class="flex gap-2">
        <button onclick="closeSubFolderModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 rounded-xl text-sm font-medium">取消</button>
        <button onclick="createSubFolder()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl text-sm font-medium">建立</button>
      </div>
    </div>
  </div>

  <!-- Firebase 雲端與應用程式邏輯 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 你的 Firebase 設定
    const firebaseConfig = {
      apiKey: "AIzaSyBGtBlMHiCJFrzV6jzFMSaYrpWCHUwKdrc",
      authDomain: "vocab-app-a95c0.firebaseapp.com",
      projectId: "vocab-app-a95c0",
      storageBucket: "vocab-app-a95c0.firebasestorage.app",
      messagingSenderId: "322032736816",
      appId: "1:322032736816:web:9ce545c9d672b4ef6febf5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUserId = null;
    window.appData = {
      languages: ["日文", "西文", "英文", "韓文"],
      subFolders: {
        "日文": ["vocab", "travel"],
        "西文": ["basics", "verbs"],
        "英文": ["GRE", "daily"],
        "韓文": ["TOPIK"]
      },
      words: []
    };

    // 監聽 Firebase 登入狀態 (實現自動記憶登入)
    onAuthStateChanged(auth, (user) => {
      const loginScreen = document.getElementById('login-screen');
      if (user) {
        currentUserId = user.uid;
        document.getElementById('user-email-display').innerText = user.email || '已登入';
        loginScreen.classList.add('hidden');
        loadCloudData();
      } else {
        currentUserId = null;
        loginScreen.classList.remove('hidden');
      }
    });

    window.handleLogin = async function() {
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;
      if (!email || !password) {
        alert('請輸入 Email 與密碼');
        return;
      }
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        alert('登入失敗：請確認帳號密碼是否正確');
        console.error(error);
      }
    };

    window.handleRegister = async function() {
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;
      if (!email || !password) {
        alert('請輸入要註冊的 Email 與密碼');
        return;
      }
      try {
        await createUserWithEmailAndPassword(auth, email, password);
        alert('註冊成功並已自動登入！');
      } catch (error) {
        alert('註冊失敗：密碼需至少6位數或 Email 格式有誤');
        console.error(error);
      }
    };

    window.handleLogout = async function() {
      if (confirm('確定要登出嗎？')) {
        try {
          await signOut(auth);
          location.reload();
        } catch (error) {
          console.error("登出失敗", error);
        }
      }
    };

    // 從 Firebase 載入資料
    window.loadCloudData = async function() {
      if (!currentUserId) return;
      try {
        const querySnapshot = await getDocs(collection(db, "users", currentUserId, "multilevel_words"));
        window.appData.words = [];
        querySnapshot.forEach((doc) => {
          window.appData.words.push({ id: doc.id, ...doc.data() });
        });

        const metaSnap = await getDocs(collection(db, "users", currentUserId, "multilevel_meta"));
        metaSnap.forEach((doc) => {
          if (doc.id === "structure" && doc.data()) {
            if (doc.data().languages) window.appData.languages = doc.data().languages;
            if (doc.data().subFolders) window.appData.subFolders = doc.data().subFolders;
          }
        });

        initAppUI();
      } catch (e) {
        console.error("雲端載入失敗", e);
      }
    };

    window.saveMetaToCloud = async function() {
      if (!currentUserId) return;
      await setDoc(doc(db, "users", currentUserId, "multilevel_meta", "structure"), {
        languages: window.appData.languages,
        subFolders: window.appData.subFolders
      });
    };

    window.saveWordToCloud = async function(wordObj) {
      if (!currentUserId) return;
      const id = wordObj.id || Date.now().toString();
      wordObj.id = id;
      await setDoc(doc(db, "users", currentUserId, "multilevel_words", id), wordObj);
      loadCloudData();
    };

    window.deleteWordFromCloud = async function(id) {
      if (!currentUserId) return;
      await deleteDoc(doc(db, "users", currentUserId, "multilevel_words", id));
      loadCloudData();
    };

    // 初始化介面與狀態記憶
    function initAppUI() {
      renderLangSelect();
      const lastState = loadLastState();
      if (lastState && window.appData.languages.includes(lastState.lang)) {
        document.getElementById('lang-select').value = lastState.lang;
        onLanguageChange(lastState.subFolder);
      } else {
        onLanguageChange();
      }
    }

    function saveLastState(lang, subFolder) {
      localStorage.setItem('vocab_vault_last_state', JSON.stringify({ lang, subFolder }));
    }

    function loadLastState() {
      const savedState = localStorage.getItem('vocab_vault_last_state');
      if (savedState) {
        try { return JSON.parse(savedState); } catch(e) { return null; }
      }
      return null;
    }

    window.renderLangSelect = function() {
      const select = document.getElementById('lang-select');
      const current = select.value;
      let html = '';
      window.appData.languages.forEach(lang => {
        html += `<option value="${lang}">${lang}</option>`;
      });
      select.innerHTML = html;
      if (window.appData.languages.includes(current)) {
        select.value = current;
      }
    }

    window.onLanguageChange = function(preferredSubFolder = null) {
      const lang = document.getElementById('lang-select').value;
      const subSelect = document.getElementById('subfolder-select');
      const subs = window.appData.subFolders[lang] || [];
      
      let html = '';
      subs.forEach(sub => {
        html += `<option value="${sub}">${sub}</option>`;
      });
      subSelect.innerHTML = html;

      if (preferredSubFolder && subs.includes(preferredSubFolder)) {
        subSelect.value = preferredSubFolder;
      }

      onSubFolderChange();
    }

    window.onSubFolderChange = function() {
      const lang = document.getElementById('lang-select').value;
      const sub = document.getElementById('subfolder-select').value;
      saveLastState(lang, sub);
      renderApp();
    }

    window.renderApp = function() {
      const lang = document.getElementById('lang-select').value;
      const sub = document.getElementById('subfolder-select').value;
      const keyword = document.getElementById('search-input').value.toLowerCase();
      const listContainer = document.getElementById('word-list');
      const emptyState = document.getElementById('empty-state');

      if (!sub) {
        listContainer.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      const filtered = window.appData.words.filter(w => {
        return w.lang === lang && w.subFolder === sub && 
          (w.term.toLowerCase().includes(keyword) || w.definition.toLowerCase().includes(keyword));
      });

      if (filtered.length === 0) {
        listContainer.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      let html = '';
      filtered.forEach(w => {
        html += `
          <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-2xs flex items-center justify-between gap-3">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-0.5">
                <span class="font-semibold text-slate-800 text-base truncate">${w.term}</span>
                <span class="text-xs px-2 py-0.5 rounded-md bg-indigo-50 text-indigo-600 font-medium">${w.subFolder}</span>
              </div>
              <p class="text-sm text-slate-600 truncate">${w.definition}</p>
              ${w.note ? `<p class="text-xs text-slate-400 mt-1 truncate"><i class="fa-solid fa-note-sticky mr-1"></i>${w.note}</p>` : ''}
            </div>
            <div class="flex items-center gap-1 shrink-0">
              <button onclick="speak('${w.term}', '${w.lang}')" class="w-9 h-9 rounded-xl bg-slate-50 hover:bg-indigo-50 text-slate-600 hover:text-indigo-600 flex items-center justify-center transition" title="發音">
                <i class="fa-solid fa-volume-high text-xs"></i>
              </button>
              <button onclick="openEditModal('${w.id}')" class="w-9 h-9 rounded-xl bg-slate-50 hover:bg-amber-50 text-slate-400 hover:text-amber-600 flex items-center justify-center transition" title="編輯">
                <i class="fa-solid fa-pen text-xs"></i>
              </button>
              <button onclick="deleteWord('${w.id}')" class="w-9 h-9 rounded-xl bg-slate-50 hover:bg-rose-50 text-slate-400 hover:text-rose-600 flex items-center justify-center transition" title="刪除">
                <i class="fa-solid fa-trash-can text-xs"></i>
              </button>
            </div>
          </div>
        `;
      });
      listContainer.innerHTML = html;
    }

    // 發音功能
    window.speak = function(text, langName) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        const langMap = { 
          "日文": "ja-JP", 
          "西文": "es-ES", 
          "英文": "en-US", 
          "韓文": "ko-KR",
          "法文": "fr-FR",
          "德文": "de-DE"
        };
        utterance.lang = langMap[langName] || "en-US";
        window.speechSynthesis.speak(utterance);
      } else {
        alert('您的瀏覽器不支援語音發音功能');
      }
    };

    // Modal 控制
    window.openWordModal = function() {
      document.getElementById('edit-word-id').value = '';
      document.getElementById('modal-title').innerText = '新增單字';
      document.getElementById('submit-btn').innerText = '確認新增';
      document.getElementById('word-term').value = '';
      document.getElementById('word-definition').value = '';
      document.getElementById('word-note').value = '';
      document.getElementById('word-modal').classList.remove('hidden');
    };

    window.openEditModal = function(id) {
      const word = window.appData.words.find(w => w.id === id);
      if (!word) return;

      document.getElementById('edit-word-id').value = word.id;
      document.getElementById('modal-title').innerText = '編輯單字';
      document.getElementById('submit-btn').innerText = '儲存修改';
      document.getElementById('word-term').value = word.term;
      document.getElementById('word-definition').value = word.definition;
      document.getElementById('word-note').value = word.note || '';
      document.getElementById('word-modal').classList.remove('hidden');
    };

    window.closeWordModal = function() { document.getElementById('word-modal').classList.add('hidden'); };
    window.openLangModal = function() { document.getElementById('lang-modal').classList.remove('hidden'); };
    window.closeLangModal = function() { document.getElementById('lang-modal').classList.add('hidden'); };
    window.openSubFolderModal = function() { document.getElementById('subfolder-modal').classList.remove('hidden'); };
    window.closeSubFolderModal = function() { document.getElementById('subfolder-modal').classList.add('hidden'); };

    window.createLanguage = function() {
      const name = document.getElementById('new-lang-name').value.trim();
      if (name && !window.appData.languages.includes(name)) {
        window.appData.languages.push(name);
        window.appData.subFolders[name] = [];
        saveMetaToCloud();
        renderLangSelect();
        document.getElementById('lang-select').value = name;
        onLanguageChange();
        closeLangModal();
        document.getElementById('new-lang-name').value = '';
      } else {
        alert('名稱不能為空或已存在');
      }
    };

    window.createSubFolder = function() {
      const lang = document.getElementById('lang-select').value;
      const sub = document.getElementById('new-subfolder-name').value.trim();
      if (sub) {
        if (!window.appData.subFolders[lang]) window.appData.subFolders[lang] = [];
        if (!window.appData.subFolders[lang].includes(sub)) {
          window.appData.subFolders[lang].push(sub);
          saveMetaToCloud();
          onLanguageChange(sub);
          closeSubFolderModal();
          document.getElementById('new-subfolder-name').value = '';
        } else {
          alert('該子資料夾已存在');
        }
      }
    };

    window.handleWordSubmit = function(e) {
      e.preventDefault();
      const editId = document.getElementById('edit-word-id').value;
      const lang = document.getElementById('lang-select').value;
      const subFolder = document.getElementById('subfolder-select').value;
      const term = document.getElementById('word-term').value.trim();
      const definition = document.getElementById('word-definition').value.trim();
      const note = document.getElementById('word-note').value.trim();

      if (!subFolder) {
        alert('請先建立並選擇一個子資料夾！');
        return;
      }

      const id = editId || Date.now().toString();
      const wordObj = { id, lang, subFolder, term, definition, note };
      
      saveWordToCloud(wordObj);
      closeWordModal();
    };

    window.deleteWord = function(id) {
      if (confirm('確定要刪除這個單字嗎？')) {
        deleteWordFromCloud(id);
      }
    };

    // 備份功能 (複製到剪貼簿)
    window.exportData = function() {
      if (window.appData.words.length === 0) {
        alert('目前沒有任何單字可以備份！');
        return;
      }
      const jsonString = JSON.stringify(window.appData, null, 2);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(jsonString).then(() => {
          alert('✅ 雲端資料已成功備份並複製到剪貼簿！');
        });
      }
    };
  </script>
</body>
</html>
